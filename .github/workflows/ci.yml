name: ci

on:
  # build pushes to master
  push:
    branches:
      - '*'
  # build PRs from forks
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        go-version: [1.24.2]
        shell: [/bin/bash, /bin/zsh]

    name: ${{ matrix.os }} / go-${{ matrix.go-version }} / ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.2

      - run: gem install puma

      - if: contains(matrix.os, 'ubuntu')
        run: sudo apt install zsh

      - if: contains(matrix.os, 'macos')
        run: |
          sw_vers
          sudo mkdir -p /etc/resolver;
          sudo chmod 0775 /etc/resolver;
          sudo chown :staff /etc/resolver;

      - run: go mod download

      - run: go test -v -race -coverprofile=coverage.out -covermode=atomic -timeout=300s ./...
        env:
          SHELL: ${{ matrix.shell }}

  devel-release:
    runs-on: macos-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.2

      - name: Get short SHA
        id: version
        run: echo VERSION_SHA8=$(echo ${GITHUB_SHA} | cut -c-8) >> $GITHUB_OUTPUT

      - run: make release
        env:
          RELEASE: ${{ steps.version.outputs.VERSION_SHA8 }}

      - uses: actions/upload-artifact@v4
        with:
          name: puma-dev-${{ steps.version.outputs.VERSION_SHA8 }}-linux-amd64
          path: rel/linux_amd64/puma-dev

      - uses: actions/upload-artifact@v4
        with:
          name: puma-dev-${{ steps.version.outputs.VERSION_SHA8 }}-darwin-amd64
          path: rel/darwin_amd64/puma-dev

      - uses: actions/upload-artifact@v4
        with:
          name: puma-dev-${{ steps.version.outputs.VERSION_SHA8 }}-darwin-arm64
          path: rel/darwin_arm64/puma-dev
