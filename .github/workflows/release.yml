name: release

on:
  workflow_dispatch:
    inputs:
      ac_username:
        description: 'Apple Developer Username'
        required: true
      ac_password:
        description: 'Apple Developer Password'
        required: true
      certificate:
        description: 'Signing Certificate'
        required: true
      certificate_password:
        description: 'Certificate Password'
        require: true

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/setup-go@v1
        with:
          go-version: 1.17.6

      - run: go install github.com/mitchellh/gox@v1.0.2-0.20210311182516-8c3b2b9e647d
      - run: echo $(go env GOPATH)/bin >> $GITHUB_PATH

      - name: brew install gon for macOS binary notarization
        run: |
          brew tap mitchellh/gon
          brew install mitchellh/gon/gon

      - name: get release version
        id: get_version
        run: echo ::set-output name=RELEASE_VERSION::${GITHUB_REF#refs/tags/v}

      - uses: actions/checkout@v2

      - run: make release
        env:
          RELEASE: ${{ steps.get_version.outputs.RELEASE_VERSION }}
          AC_USERNAME: ${{ github.event.inputs.ac_username }}
          AC_PASSWORD: ${{ github.event.inputs.ac_password }}
          APPLE_DEVELOPER_CERTIFICATE_P12_BASE64: ${{ github.event.inputs.certificate }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ github.event.inputs.certificate_password }}

      - uses: actions/upload-artifact@v2
        with:
          name: puma-dev-${{ steps.get_version.outputs.RELEASE_VERSION }}-linux-amd64
          path: pkg

      # - uses: ncipollo/release-action@v1
      #   with:
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     artifacts: "pkg/*"
      #     allowUpdates: true
      #     omitBody: true
      #     prerelease: true
      #     removeArtifacts: true
