name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/setup-go@v1
        with:
          go-version: 1.17.6

      - run: go install github.com/mitchellh/gox@v1.0.2-0.20210311182516-8c3b2b9e647d
      - run: echo $(go env GOPATH)/bin >> $GITHUB_PATH

      - name: brew install gon for macOS binary notarization
        run: |
          brew tap mitchellh/gon
          brew install mitchellh/gon/gon

      - name: get release version
        id: get_version
        run: echo ::set-output name=RELEASE_VERSION::${GITHUB_REF#refs/tags/v}

      - uses: actions/checkout@v2

      - run: make release
        env:
          RELEASE: ${{ steps.get_version.outputs.RELEASE_VERSION }}
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          APPLE_DEVELOPER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

      - uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "pkg/*"
          allowUpdates: true
          omitBody: true
          prerelease: true
          removeArtifacts: true
