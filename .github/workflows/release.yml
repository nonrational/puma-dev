name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: 0.0.0)'
        required: true
      ac_password:
        description: 'Apple Developer ID Password'
        required: true
jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/setup-go@v1
        with:
          go-version: 1.17.6

      - run: go install github.com/mitchellh/gox@v1.0.2-0.20210311182516-8c3b2b9e647d
      - run: echo $(go env GOPATH)/bin >> $GITHUB_PATH

      - name: brew install gon for macOS binary notarization
        run: |
          brew tap mitchellh/gon
          brew install mitchellh/gon/gon

      - name: get release version
        id: get_version
        run: echo ::set-output name=RELEASE_VERSION::${GITHUB_REF#refs/tags/v}

      - uses: actions/checkout@v2
        with:
          ref: refs/tags/v${{ github.event.inputs.version }}

      - run: make release
        env:
          RELEASE: ${{ github.event.inputs.version }}

      - uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "pkg/*"
          allowUpdates: true
          omitBody: true
          prerelease: true
          removeArtifacts: true
